const diseaseLibrary={"Appendicitis": ["Migrating periumbilical to RLQ pain; anorexia; focal tenderness", "A convincing alternative diagnosis; atypical presentations remain possible", "Serial abdominal examination; peritoneal signs", "CBC; pregnancy testing when applicable; ultrasound or CT as indicated", "Progressive pain, peritonitis or instability warrant urgent escalation"], "Acute coronary syndrome": ["Pressure or discomfort in chest or epigastrium; diaphoresis; dyspnea", "Alternative explanation may lower suspicion; normal initial ECG does not exclude ACS", "Perfusion, heart and lung examination", "ECG and serial troponin per local pathway", "Ongoing ischemic symptoms or instability require urgent evaluation"], "Bowel obstruction": ["Distension, vomiting, colicky pain, reduced stool or flatus", "Continued stool passage does not exclude partial obstruction", "Abdominal distension, tenderness, surgical history", "Electrolytes and abdominal imaging as indicated", "Peritonitis, persistent severe pain or shock suggest complications"], "Mesenteric ischemia": ["Severe pain, sometimes disproportionate to examination; vascular risk factors", "Normal early examination or lactate does not exclude ischemia", "Perfusion and serial abdominal examination", "Urgent CT angiography when indicated and available", "Suspected ischemia warrants urgent surgical evaluation"], "Ureterolithiasis": ["Colicky flank pain radiating toward groin; hematuria may occur", "Absence of hematuria does not exclude a stone", "CVA tenderness; abdominal examination; temperature", "Urinalysis, renal function, imaging as indicated", "Fever with suspected obstruction, anuria or instability requires urgent escalation"], "Pulmonary embolism": ["Dyspnea, pleuritic pain, syncope, thromboembolic risk factors", "Normal oxygen saturation does not exclude PE", "Respiratory effort, perfusion, leg swelling", "Validated pretest assessment and testing pathway as appropriate", "Shock, syncope or severe respiratory co function integratedEvidence(){const n=id=>get(id).trim?.()!==''&&get(id)!==''&&Number.isFinite(Number(get(id)))?Number(get(id)):null;const k=n('potassium'),bp=n('sbp'),hr=n('hr');let alerts=[];if(bp!==null&&bp>0&&bp<90)alerts.push('Recorded SBP below 90 mmHg: assess perfusion and urgent causes of instability.');if(k!==null&&k>5.5){alerts.push('Elevated recorded potassium: verify specimen and clinical context; review ECG and renal function.');if(get('sampleHemolysis')==='Present')alerts.push('Hemolysis reported: potassium may be unreliable. Do not dismiss possible true hyperkalemia or delay urgent care for instability.');if(get('ecgWide')==='Present'||get('ecgPeaked')==='Present'||get('ecgHyperK')==='Present'||(hr!==null&&hr>0&&hr<50))alerts.push('Elevated potassium with recorded ECG changes or bradycardia: urgent clinical review and applicable emergency protocol.');}if(get('usFreeFluid')==='Present'&&bp!==null&&bp>0&&bp<90)alerts.push('Reported free intraperitoneal fluid with hypotension: urgent assessment for hemorrhage and other causes.');if(get('xrayFreeAir')==='Present'||get('ctFreeAir')==='Present')alerts.push('Reported free intraperitoneal air: urgent assessment for perforation and other causes.');return `<h3>Cross-domain safety prompts</h3><p class="mini">Training examples only; not exhaustive or validated. Imaging and ECG entries are clinician-reported findings, not automated interpretations.</p>${alerts.map(a=>`<div class="alert">${esc(a)}</div>`).join('')||'<p class="muted">No configured pattern detected. This does not establish stability or exclude disease.</p>'}`;}

function evidenceState(e){if(e.numeric){const v=get(e.id);return v!==''&&Number.isFinite(Number(v))&&(e.test?e.test(Number(v)):Number(v)>5.5)?'support':'unknown'}const v=get(e.id);return v===e.yes?'support':v===e.no?'negative':'unknown'}
function correlation(d){const r=(rules[d]||[]).filter(e=>allfields().some(f=>f[0]===e.id));const support=r.filter(e=>evidenceState(e)==='support'),negative=r.filter(e=>evidenceState(e)==='negative'),unknown=r.filter(e=>evidenceState(e)==='unknown');return {support,negative,unknown,color:support.length>=2?'#dc2626':support.length?'#ca8a04':negative.length&&!unknown.length?'#15803d':'#222',label:support.length>=2?'Multiple matching findings':support.length?'Matching finding':negative.length&&!unknown.length?'No configured positive matches; not excluded':'Insufficient information'}}
function refine(d){const c=correlation(d);return `<p><strong>Training correlation:</strong> ${esc(c.label)}</p>${c.support.map(e=>`<p class="good">Supporting match: ${esc(e.description||labelFor(e.id))}</p>`).join('')}${c.negative.map(e=>`<p>Documented negative: ${esc(labelFor(e.id))} — does not exclude disease.</p>`).join('')}<h3>Refine differential</h3><p class="mini">Tap a selected option again to deselect it. Clear an entry to return it to not documented.</p>${(rules[d]||[]).filter((e,i,a)=>a.findIndex(x=>x.id===e.id)===i).map(e=>{const f=allfields().find(f=>f[0]===e.id);return f?`<div class="field">${field(f)}<button class="smallbtn" data-clear-ddx="${e.id}">Clear response</button> <button class="smallbtn" data-jump="${e.id}">Open original field</button></div>`:''}).join('')||'<p class="mini">No unanswered configured prompts.</p>'}`}
function diseaseCard(d){const r=diseaseLibrary[d],c=correlation(d);return `<details class="field" data-disease="${esc(d)}"><summary><span style="color:${c.color}">●</span> ${esc(d)}${r?'':' — card pending'}</summary>${refine(d)}<p class="muted">Relevant assessments: ${esc([...activeModules].filter(k=>modules[k].dx.includes(d)).map(k=>modules[k].name).join('; '))}</p>${r?['Supporting findings','Limitations / alternative explanations','Focused examination','Diagnostic considerations','Escalation considerations'].map((label,i)=>`<h3>${label}</h3><p>${esc(r[i])}</p>`).join('')+'<h3>When diagnostics are unavailable</h3><p>Repeat relevant examinations and vital signs, document limitations, seek consultation and arrange escalation as indicated. Bedside findings cannot reliably exclude serious disease.</p><p class="mini">Original draft educational content — independent source verification and clinical review pending.</p>':'<p>Detailed clinical reference not yet developed. Consult authoritative guidance.</p>'}</details>`}
function combinedDDx(){const dx=[...new Set([...activeModules].flatMap(k=>modules[k].dx))];if(get("potassium")!==""&&Number(get("potassium"))>5.5||get("ecgHyperK")==="Present")dx.push("Hyperkalemia");if(get("xrayFreeAir")==="Present"||get("ctFreeAir")==="Present")dx.push("Bowel perforation");if(get("usEctopic")==="Present")dx.push("Ectopic pregnancy");const uniqueDx=[...new Set(dx)];return section('Combined differential — clinical reference trial',`<div class="notice">Educational draft only; not exhaustive, validated or ranked by probability. Dots demonstrate matching only: red = multiple matches; yellow = one match; green = configured negatives only (not excluded); black = insufficient information. These are unweighted interface-test rules, not clinical likelihood. Inclusion does not establish a diagnosis. Do not delay care for documentation.</div>${integratedEvidence()}<h3>Time-sensitive considerations</h3>${uniqueDx.filter(d=>urgentDx.includes(d)).map(diseaseCard).join('')||'<p>No configured entries.</p>'}<h3>Other considerations</h3>${uniqueDx.filter(d=>!urgentDx.includes(d)).map(diseaseCard).join('')}<details class="field"><summary>Reference review queue</summary><p>Candidate sources for independent review (not verified citations for these draft cards):</p><p><a href="https://digitalddx.com/">DigitalDDx</a> · <a href="https://www.aafp.org/afp/">AAFP</a> · <a href="https://www.merckmanuals.com/professional">Merck Manual</a> · <a href="https://acsearch.acr.org/list">ACR</a> · <a href="https://jts.health.mil/">JTS</a></p></details>`)}

function acidPanel(){return section('Acid–base learning tool',`<div class="notice">Training only. Use adult arterial results from one sample. Confirm units and sample timing. Calculations do not establish a diagnosis.</div><details><summary>ABG interpretation and anion gap</summary><p>Uses entered arterial pH, PaCO₂ (mmHg), bicarbonate (mmol/L), and chemistry sodium, chloride and bicarbonate (mmol/L).</p><div class="choices">${['abg_ph','abg_co2','abg_hco3','sodium','chloride','bicarb'].map(id=>`<button class="smallbtn" data-jump="${id}">${esc(labelFor(id))}: ${esc(get(id)||'Not entered')}</button>`).join('')}</div><label><input type="checkbox" id="acidConfirm"> I confirm ABG values are from the same arterial sample and chemistry values are from the same chemistry sample, with the stated units.</label><p id="acidResult" class="acid-result" aria-live="polite">Confirm sample and units to calculate.</p><p class="mini">MMG-ACID-01 · Draft educational formulas; source and clinical validation pending.</p></details>`)}
function acidText(){const n=id=>String(get(id)).trim()===''?NaN:Number(get(id));const p=n('abg_ph'),c=n('abg_co2'),h=n('abg_hco3'),na=n('sodium'),cl=n('chloride'),b=n('bicarb');let out=[];if([p,c,h].every(Number.isFinite)&&p>6&&p<8&&c>0&&h>0){out.push(p<7.35?'Acidemia':p>7.45?'Alkalemia':'pH within illustrative adult interval; mixed disorders remain possible.');if(p<7.35&&h<22){const e=1.5*h+8;out.push('Low bicarbonate with acidemia suggests metabolic acidosis. Winter’s expected PaCO₂: '+(e-2).toFixed(1)+'–'+(e+2).toFixed(1)+' mmHg. '+(c>e+2?'Measured PaCO₂ above expected: consider additional respiratory acidosis.':c<e-2?'Measured PaCO₂ below expected: consider additional respiratory alkalosis.':'Measured PaCO₂ within expected interval.'));}if(p<7.35&&c>45)out.push('Elevated PaCO₂ with acidemia suggests a respiratory acidifying component.');if(p>7.45&&c<35)out.push('Low PaCO₂ with alkalemia suggests a respiratory alkalinizing component.');if(p>7.45&&h>26)out.push('Elevated bicarbonate with alkalemia suggests a metabolic alkalinizing component.');}else out.push('ABG: enter valid arterial pH, PaCO₂ and bicarbonate.');if([na,cl,b].every(Number.isFinite)&&na>0&&cl>0&&b>0)out.push('Anion gap (excluding potassium) = '+(na-cl-b).toFixed(1)+' mmol/L. Compare with local interval; albumin and analytical method affect interpretation.');else out.push('Anion gap: enter sodium, chloride and chemistry bicarbonate.');return out.join('\n\n');}

const hemeTopics=[
['ANEMIA','Anemia and red cell size',['hemoglobin','hct','mcv','rdw','rbc'], 'Low hemoglobin supports anemia when interpreted against the appropriate patient reference interval. Low MCV suggests microcytic morphology (iron deficiency or thalassemia among others); normal MCV may accompany blood loss, inflammation or renal disease; high MCV may accompany B12/folate deficiency, medications or liver disease. Mixed causes can produce normal MCV. Review smear, iron studies, bleeding history and baseline.'],
['MARROW','Reticulocyte response',['hemoglobin','hct','retic','rdw'], 'Reticulocyte percentage alone can overstate marrow response in anemia. Obtain absolute reticulocyte count and consider anemia severity, timing, transfusion and treatment. Increased response may accompany blood loss or hemolysis; an inadequate response may suggest impaired production. Early blood loss may precede a measurable response.'],
['PLATELET','Platelet abnormalities',['platelets','hemoglobin','pt','aptt','fibrinogen'], 'Low platelets may reflect consumption, reduced production, sequestration, dilution or specimen clumping. High counts may be reactive or clonal. Review smear, trends, medications, bleeding and thrombosis. Platelet count does not measure platelet function.'],
['CLOT','PT and aPTT patterns',['pt','inr','aptt','fibrinogen'], 'Isolated prolonged PT may accompany factor VII deficiency, vitamin K deficiency or warfarin effect. Isolated prolonged aPTT may accompany intrinsic factor deficiencies, heparin or inhibitors. Both prolonged may accompany common pathway abnormalities, liver disease, consumption or anticoagulants. Normal times do not exclude bleeding disorders. Review medications, sample quality and local intervals.'],
['CONSUMPTION','Consumption and dilution considerations',['platelets','pt','aptt','fibrinogen','ddimer'], 'Falling platelets, prolonged PT, falling fibrinogen and elevated fibrin degradation markers can accompany consumption or other coagulopathies. Trauma, dilution, liver dysfunction and anticoagulants can overlap. DIC requires clinical context and appropriate validated criteria; normal fibrinogen does not exclude early DIC. Review serial results and active bleeding.']];

const metabolicTopics=[["DKA", "Diabetic emergencies", ["glucose", "bhb", "abg_ph", "abg_hco3", "vbg_ph", "vbg_hco3", "bicarb", "potassium", "creatinine"], "Insulin deficiency can promote ketogenesis and metabolic acidosis. Hyperglycemia may cause osmotic diuresis; ketoacidosis can also occur without marked hyperglycemia. Hyperosmolar states and ketoacidosis may overlap. Serum potassium does not reliably reflect total-body stores.", "Review diabetes history, SGLT2 inhibitors, intake, infection, mental status, hydration and serial results. Consider measured or calculated osmolality using appropriate units. Do not exclude ketoacidosis using glucose alone."], ["RENAL", "Renal dysfunction", ["bun", "creatinine", "egfr", "potassium", "bicarb", "phos"], "Reduced filtration may accompany retention of nitrogenous waste, potassium and acid. Creatinine is influenced by muscle mass, medications and timing; BUN also varies with hydration, catabolism and gastrointestinal bleeding. Reported eGFR may be unreliable during rapidly changing renal function.", "Review baseline and serial creatinine, timed urine output, volume status, nephrotoxic exposures and possible obstruction. A single result cannot establish acute kidney injury or chronic kidney disease."], ["MUSCLE", "Rhabdomyolysis considerations", ["ck", "potassium", "creatinine", "phos", "ca_total", "ca_ion", "ua_rbc"], "Muscle breakdown can release CK, potassium, phosphate and myoglobin. Kidney injury and electrolyte disturbances may follow. CK is not specific to rhabdomyolysis and may rise after exertion or trauma. Urine microscopy alone cannot establish myoglobinuria.", "Review exertion, crush injury, heat exposure, medications, muscle symptoms, urine output, ECG and serial results. Compare urine dipstick heme with microscopy if available."], ["ELECTROLYTE", "Electrolyte disturbances", ["sodium", "potassium", "chloride", "mg", "ca_total", "ca_ion", "phos", "bicarb"], "Electrolyte abnormalities can affect membrane excitability, muscle function and cardiac conduction. Magnesium deficiency can contribute to persistent potassium or calcium abnormalities. Total calcium is influenced by protein binding; ionized calcium varies with pH.", "Review ECG, neurological symptoms, renal function, medications, fluid losses and specimen quality. Hemolysis may falsely elevate potassium. A normal ECG does not exclude dangerous potassium abnormalities."], ["PERFUSION", "Tissue hypoperfusion considerations", ["lactate", "abg_ph", "abg_hco3", "bicarb", "hemoglobin", "creatinine"], "Lactate can rise with impaired oxygen delivery, adrenergic stimulation, seizures, medications or impaired clearance. Elevated lactate is not specific for shock or sepsis; normal lactate does not exclude either.", "Review blood pressure and MAP trends, mental status, capillary refill, skin findings, urine output, bleeding and respiratory status. Interpret serial lactate with timing and interventions."], ["LIVER", "Hepatic injury and function", ["ast", "alt", "alp", "ggt", "bilirubin", "direct_bili", "inr", "albumin"], "Aminotransferases reflect cellular injury rather than directly measuring liver function. ALP and GGT may support a hepatobiliary source; bilirubin reflects several processes including production and excretion. INR and albumin may reflect synthetic function but have important nonhepatic influences.", "Review medication and toxin exposures, alcohol, infection, jaundice, bleeding, mental status and imaging. Consider muscle injury as a source of AST, anticoagulants as an influence on INR and inflammation or nutrition as influences on albumin."]];

function bindCalculators(){const q=id=>document.getElementById(id);function recalc(i){const d=calcDefs[i],raw=d[2].map((_,j)=>q('calcOut'+i).parentElement.querySelector(`[data-calc="${i}-${j}"]`).value),v=raw.map(Number),ok=raw.every(x=>x.trim()!=='')&&v.every((x,j)=>Number.isFinite(x)&&(i===4&&j===2?x>=0:x>0));const n=ok?d[5](v):NaN;q('calcOut'+i).textContent=Number.isFinite(n)?`${Number(n.toFixed(2))} ${d[4]}`:'Enter valid values';}document.querySelectorAll('[data-calc]').forEach(el=>el.oninput=()=>{calcValues[el.dataset.calc]=el.value;recalc(+el.dataset.calc.split('-')[0])});document.querySelectorAll('[data-prefill]').forEach(b=>b.onclick=()=>{let i=+b.dataset.prefill;calcDefs[i][2].forEach(([id],j)=>{let el=document.querySelector(`[data-calc="${i}-${j}"]`);el.value=get(id);calcValues[i+'-'+j]=el.value});recalc(i)});calcDefs.forEach((_,i)=>recalc(i));q('calcSearch').oninput=e=>{let v=e.target.value.trim().toLowerCase();document.querySelectorAll('.calc-category').forEach(d=>{d.hidden=!!v&&!d.dataset.search.includes(v);if(v&&!d.hidden)d.open=true})};bindBurn()}
function bindBurn(){const q=id=>document.getElementById(id),c=q('burnCanvas'),g=c.getContext('2d'),W=360,H=360;let mask=new Int16Array(W*H),weights=[],parts=[],active=null,last=null,cursor=null;function setup(){parts=[];for(let side=0;side<2;side++){let x=90+180*side,h=burn.mode==='adult'?18:25,hip=burn.mode==='adult'?195:205;let add=(d,w)=>parts.push({p:new Path2D(d),w});add(`M${x-h} 35 A${h} ${h+5} 0 1 0 ${x+h} 35 A${h} ${h+5} 0 1 0 ${x-h} 35`,4.5);add(`M${x-10} 62 L${x-32} 77 L${x-24} 139 L${x-30} ${hip} H${x+30} L${x+24} 139 L${x+32} 77 L${x+10} 62 Z`,18);for(let sign of [-1,1]){let a=n=>x+sign*n;add(`M${a(33)} 77 L${a(47)} 82 L${a(68)} 181 Q${a(70)} 193 ${a(57)} 192 L${a(43)} 153 L${a(28)} 109 Z`,4.5);add(`M${a(30)} ${hip+1} L${a(3)} ${hip+1} L${a(7)} 309 L${a(10)} 328 L${a(34)} 328 L${a(29)} 309 Z`,9)}if(!side)add(`M${x-8} ${hip-7} H${x+8} L${x} ${hip+5} Z`,1)}let off=document.createElement('canvas');off.width=W;off.height=H;let o=off.getContext('2d');parts.forEach((p,i)=>{o.fillStyle=`rgb(${i+1},0,0)`;o.fill(p.p)});let pix=o.getImageData(0,0,W,H).data,counts=parts.map(()=>0);mask.fill(-1);for(let i=0;i<mask.length;i++){let n=pix[i*4]-1;if(pix[i*4+3]===255&&n>=0&&n<parts.length){mask[i]=n;counts[n]++}}weights=parts.map((p,i)=>p.w/(counts[i]||1));draw()}
function draw(){g.clearRect(0,0,W,H);parts.forEach(p=>{g.fillStyle='#d8dfe5';g.fill(p.p);g.strokeStyle='#8293a2';g.stroke(p.p)});let img=g.getImageData(0,0,W,H),total=0;for(let i=0;i<mask.length;i++)if(burn.marks[i]&&mask[i]>=0){img.data.set([189,66,72,255],i*4);total+=weights[mask[i]]}g.putImageData(img,0,0);g.fillStyle='#344454';g.font='12px system-ui';g.textAlign='center';g.fillText('ANTERIOR',90,350);g.fillText('POSTERIOR',270,350);if(cursor){g.beginPath();g.arc(...cursor,burn.size/2,0,Math.PI*2);g.strokeStyle=burn.erase?'#344454':'#9d1721';g.lineWidth=1.5;g.setLineDash([4,3]);g.stroke();g.setLineDash([])}q('burnTotal').textContent=burn.mode==='adult'?total.toFixed(1)+'% estimated TBSA':'Pediatric TBSA: not calculated';let m=Number(burn.manual);q('burnConfirmed').textContent=burn.manual!==''&&Number.isFinite(m)&&m>=0&&m<=100?'Manual TBSA: '+m+'% (not transferred)':burn.manual!==''?'Enter 0–100%.':'No manual override.';q('brushNum').textContent=burn.size+' px';q('brushPreview').setAttribute('r',burn.size/2);q('brushPreview').setAttribute('fill',burn.erase?'none':'#bd4248');q('burnPaint').classList.toggle('secondary',burn.erase);q('burnErase').classList.toggle('secondary',!burn.erase);q('burnAdult').classList.toggle('secondary',burn.mode!=='adult');q('burnPed').classList.toggle('secondary',burn.mode!=='ped');q('burnAgeBox').hidden=burn.mode!=='ped'}
function snapshot(){burn.undo.push(burn.marks.slice());if(burn.undo.length>30)burn.undo.shift();burn.redo=[]}function stamp(x,y){let r=burn.size/2;for(let yy=Math.max(0,Math.floor(y-r));yy<Math.min(H,Math.ceil(y+r));yy++)for(let xx=Math.max(0,Math.floor(x-r));xx<Math.min(W,Math.ceil(x+r));xx++)if((xx-x)**2+(yy-y)**2<=r*r&&mask[yy*W+xx]>=0)burn.marks[yy*W+xx]=burn.erase?0:1}function point(e){let b=c.getBoundingClientRect();return [(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]}
c.onpointerdown=e=>{if(active!==null)return;e.preventDefault();active=e.pointerId;c.setPointerCapture(active);snapshot();last=cursor=point(e);stamp(...last);draw()};c.onpointermove=e=>{if(active!==null&&active!==e.pointerId)return;cursor=point(e);if(active!==null){let n=Math.max(1,Math.ceil(Math.hypot(cursor[0]-last[0],cursor[1]-last[1])/2));for(let i=1;i<=n;i++)stamp(last[0]+(cursor[0]-last[0])*i/n,last[1]+(cursor[1]-last[1])*i/n);last=cursor}draw()};c.onpointerup=c.onpointercancel=c.onlostpointercapture=e=>{if(e.pointerId===active){active=null;last=null;cursor=null;draw()}};c.onpointerleave=()=>{if(active===null){cursor=null;draw()}};function mode(m){if(m===burn.mode)return;if((burn.marks.some(Boolean)||burn.manual!=='')&&!confirm('Change body type and clear current burn assessment?'))return;burn.mode=m;burn.marks.fill(0);burn.undo=[];burn.redo=[];burn.manual='';q('burnManual').value='';setup()}q('burnAdult').onclick=()=>mode('adult');q('burnPed').onclick=()=>mode('ped');q('burnAge').value=burn.age;q('burnAge').oninput=e=>burn.age=e.target.value;q('burnBrush').value=burn.size;q('burnBrush').oninput=e=>{burn.size=+e.target.value;draw()};q('burnPaint').onclick=()=>{burn.erase=false;draw()};q('burnErase').onclick=()=>{burn.erase=true;draw()};q('burnUndo').onclick=()=>{if(burn.undo.length){burn.redo.push(burn.marks.slice());burn.marks=burn.undo.pop();draw()}};q('burnRedo').onclick=()=>{if(burn.redo.length){burn.undo.push(burn.marks.slice());burn.marks=burn.redo.pop();draw()}};q('burnClear').onclick=()=>{snapshot();burn.marks.fill(0);draw()};q('burnManual').value=burn.manual;q('burnManual').oninput=e=>{burn.manual=e.target.value;draw()};c.style.width=burn.zoom*100+'%';q('burnZoom').onclick=()=>{burn.zoom=burn.zoom===1?2:1;c.style.width=burn.zoom*100+'%'};setup()}
