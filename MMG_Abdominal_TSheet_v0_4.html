fields.initial.push(...fields.diagnostics.filter(f=>['etco2','capno','ecg'].includes(f[0]))); fields.diagnostics=fields.diagnostics.filter(f=>!['etco2','capno','ecg'].includes(f[0]));

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function statusField(id,label,opts){const val=get(id);return `<div class="field"><label>${esc(label)}</label><div class="choices">${opts.map(o=>`<button type="button" aria-pressed="${val===o}" class="${val===o?'chosen':''} ${val===o&&o==='Abnormal'?'bad':''}" data-set="${id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>${val?`<div class="choice-note"><label for="note_${id}" class="mini">Details for ${esc(val)} (optional)</label><textarea id="note_${id}" data-input="${id}_note" placeholder="Add observed findings, timing, severity or relevant details…">${esc(get(id+'_note'))}</textarea></div>`:''}</div>`}
// Illustrative adult ranges only; verify against the reporting laboratory and patient context.
const labRanges={

 alt:'Reference interval varies by assay, sex and laboratory; enter the laboratory range.',

const rangeKey='mmg-lab-reference-v1'; let localRanges={};try{localRanges=JSON.parse(localStorage.getItem(rangeKey)||'{}')||{}}catch(e){};
for(const [id,r] of Object.entries(localRanges)){if(Array.isArray(r)&&r.length===2){data[id+'_lo']=String(r[0]);data[id+'_hi']=String(r[1]);}}
function saveRange(id){const lo=get(id+'_lo'),hi=get(id+'_hi');if(lo===''&&hi==='')delete localRanges[id];else if(lo!==''&&hi!==''&&Number.isFinite(Number(lo))&&Number.isFinite(Number(hi))&&Number(lo)<Number(hi))localRanges[id]=[Number(lo),Number(hi)];else return;try{localStorage.setItem(rangeKey,JSON.stringify(localRanges))}catch(e){}}
function labBounds(id){const customLo=get(id+'_lo'),customHi=get(id+'_hi');if(customLo!==''&&customHi!==''&&Number.isFinite(Number(customLo))&&Number.isFinite(Number(customHi))&&Number(customLo)<Number(customHi))return [Number(customLo),Number(customHi),'custom laboratory range'];return labRanges[id]||null;}
function labStatus(id){const raw=String(get(id)).trim(),manual=get(id+'_state')||'Not entered',bounds=labBounds(id);if(raw!==''&&Number.isFinite(Number(raw))&&bounds){const n=Number(raw);return n<bounds[0]?'Low':n>bounds[1]?'High':'Normal'}return manual;}
function field(f){const [id,label,type,opts]=f;const val=get(id);if(type==='status')return statusField(id,label,['Normal','Abnormal','Not assessed','Unavailable']);if(type==='choice')return statusField(id,label,opts);if(type==='lab'){
 const state=labStatus(id),manual=get(id+'_state')||'Not entered',bounds=labBounds(id),hasValue=String(val).trim()!==''&&Number.isFinite(Number(val));

 return `<div class="field"><label>${esc(label)}</label><div class="mini"><strong>Typical adult reference:</strong> ${esc(reference)}</div><div class="grid" style="margin-top:8px"><input class="${abnormal?'lab-abnormal':''}" aria-label="${esc(label)} value" data-input="${id}" inputmode="decimal" value="${esc(val)}" placeholder="Measured value"><select class="${abnormal?'lab-abnormal':''}" aria-label="${esc(label)} interpretation" data-input="${id}_state" ${auto?'disabled title="Automatically determined from entered value"':''}>${['Not entered','Normal','High','Low','Critical','Pending','Unavailable'].map(o=>`<option ${state===o?'selected':''}>${o}</option>`).join('')}</select></div>

function render(){const openRanges=[...document.querySelectorAll("details[open]")].map(x=>x.querySelector("[data-input]")?.dataset.input);document.getElementById('tabs').innerHTML=pages.map(([id,l])=>`<button class="${current===id?'active':''}" data-page="${id}">${l}</button>`).join('');document.getElementById('warnCount').textContent=missing().length;let html='';if(current==='initial')html=section('Initial assessment',`<div class="alert"><strong>Assess immediate threats first.</strong><ul><li>Identify immediate life threats.</li><li>Assess airway, breathing, circulation and neurological status.</li><li>Recognize deterioration and escalate as indicated.</li><li>Do not delay care to complete documentation.</li></ul></div>${fields.initial.map(field).join('')}`);if(current==='history')html=section('Focused history',`<p class="muted">Based on the structure of the supplied 1996–2008 abdominal / flank pain paper T-Sheet.</p>${fields.history.map(field).join('')}`);if(current==='exam')html=section('Physical examination',`<p class="muted">Only record examinations actually performed. Blank does not mean normal.</p>${fields.exam.map(field).join('')}`);if(current==='diagnostics')html=section('Tests, ECG and capnography',`<div class="notice">Enter a value to automatically flag High or Low against the displayed illustrative adult interval. Where a range is patient- or laboratory-dependent, enter the reporting laboratory limits or select the classification manually. These ranges are not validated for clinical use.</div>${fields.diagnostics.map(field).join('')}`);if(current==='care')html=section('Interventions, reassessment and disposition',fields.care.map(field).join(''));if(current==='reasoning')html=reasoning();if(current==='report')html=report();document.getElementById('screen').innerHTML=html;document.querySelectorAll('details').forEach(x=>{if(openRanges.includes(x.querySelector('[data-input]')?.dataset.input))x.open=true});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>set(b.dataset.set,b.dataset.val));document.querySelectorAll('[data-input]').forEach(el=>{if(el.tagName==='TEXTAREA'){el.oninput=()=>{data[el.dataset.input]=el.value};}else{el.onchange=()=>{data[el.dataset.input]=el.value;if(/_(lo|hi)$/.test(el.dataset.input))saveRange(el.dataset.input.replace(/_(lo|hi)$/,''));render()};}});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jump(b.dataset.jump));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{reportType=b.dataset.report;render()});const gen=document.getElementById('generate');if(gen)gen.onclick=()=>{review=true;render()};const copy=document.getElementById('copy');if(copy)copy.onclick=()=>{navigator.clipboard?.writeText(reportText()).then(()=>alert('Copied training-only report. Do not enter real patient information.')).catch(()=>alert('Clipboard unavailable in this browser.'))};const print=document.getElementById('print');if(print)print.onclick=()=>window.print();}

function reasoning(){let findings=[];if(get('site')==='RLQ')findings.push('RLQ location: consider appendicitis alongside urinary, bowel, and reproductive causes when applicable.');if(get('guard')==='Abnormal'||get('rebound')==='Abnormal')findings.push('Guarding or rebound recorded as abnormal: evaluate urgently for peritoneal irritation and serious intra-abdominal disease.');if(get('sbp')!==''&&Number(get('sbp'))<90)findings.push('Low recorded systolic BP: reassess perfusion and consider shock.');if(get('pregnancy')==='Possible'||get('hcg')==='Positive')findings.push('Pregnancy possible or positive: ectopic pregnancy is an important time-sensitive consideration in a compatible presentation.');if(labStatus('potassium')==='High'||labStatus('potassium')==='Critical')findings.push('Potassium flagged high: verify measurement, consider ECG and renal function, and follow applicable urgent-care protocols.');if(get('capno')==='Obstructive / shark-fin')findings.push('Obstructive capnogram selected: assess ventilation, waveform quality and clinical context.');return section('Differential diagnosis support',`<div class="notice"><strong>Illustrative reasoning only.</strong> This is not a validated diagnostic engine. It does not rule out dangerous disease.</div><h3>Findings to consider</h3>${findings.length?findings.map(x=>`<div class="field">${esc(x)}</div>`).join(''):'<p class="muted">Enter findings in History, Exam, and Tests to see example context-based prompts.</p>'}<h3>Do not miss</h3><ul class="do-not-miss"><li>Shock or significant hemorrhage</li><li>Perforation or peritonitis</li><li>Ruptured abdominal aortic aneurysm when clinically plausible</li><li>Bowel obstruction or mesenteric ischemia</li><li>Ectopic pregnancy when applicable</li><li>Ovarian torsion when applicable</li><li>Testicular torsion when applicable</li><li>Other time-sensitive surgical or vascular causes</li></ul><h3>Information still needed</h3>${missing().slice(0,8).map(id=>`<div class="checkline"><span class="flag">${esc(labelFor(id))}</span><button class="smallbtn" data-jump="${id}">Go to</button></div>`).join('')||'<p class="good">No configured documentation gaps. This does not confirm a complete clinical assessment.</p>'}<p class="mini">The original paper form's clinical impression list inspired this layout; all clinical rules require independent current-source review before real-world use.</p>`)}
function reportText(){const sections=[['INITIAL',fields.initial],['HISTORY',fields.history],['EXAM',fields.exam],['DIAGNOSTICS',fields.diagnostics],['CARE',fields.care]];const header=`MMG TRAINING REPORT — NOT FOR REAL PATIENT USE\nType: ${reportType}\nPatient identifiers: NOT COLLECTED\n\n`;let out=header;for(const [name,fs] of sections){out+=name+'\n';for(const [id,label,type] of fs){let v=get(id);if(type==='lab'){const state=labStatus(id);v=(v?`${v} (verify units); `:'')+state}out+=`${label}: ${v||'NOT DOCUMENTED'}${get(id+'_note')?' | Details: '+get(id+'_note'):''}\n`}out+='\n'}out+='DOCUMENTATION GAPS\n'+(missing().map(id=>'- '+labelFor(id)).join('\n')||'None from configured fields')+'\n\nDraft based only on entered information. Verify all entries, clinical interpretations, and local documentation requirements.';return out}
function report(){const m=missing();return section('Report readiness',`<p class="muted">Report generation never blocks an urgent handoff. This demo uses fictional training information only.</p><h3>Choose report</h3><div class="choices">${['SF 600-style draft','Teleconsult summary','MIST handoff','PCC shift handoff'].map(x=>`<button class="${reportType===x?'chosen':''}" data-report="${x}">${x}</button>`).join('')}</div><h3>${m.length} documentation warning${m.length===1?'':'s'}</h3>${m.length?m.map(id=>`<div class="checkline"><span class="flag">Missing: ${esc(labelFor(id))}</span><button class="smallbtn" data-jump="${id}">Go to</button></div>`).join(''):'<p class="good">No configured fields missing.</p>'}<div class="notice">Unknown, not assessed, pending, and unavailable should be documented explicitly. A completed field does not prove the assessment was adequate.</div><button class="btn no-print" id="generate">Generate report anyway</button>${review?`<h3>Draft preview</h3><div id="preview">${esc(reportText())}</div><div class="row no-print" style="margin-top:12px"><button class="btn secondary" id="copy">Copy draft</button><button class="btn" id="print">Print / Save PDF</button></div>`:''}`)}
document.getElementById('warningBtn').onclick=()=>go('report');document.getElementById('reportBtn').onclick=()=>go('report');render();
</script></body></html>
