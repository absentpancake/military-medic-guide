<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283a"><link rel="manifest" href="manifest.webmanifest"><title>MMG v0.2</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#162a38;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#10283a;color:#fff;padding:19px 18px 15px}header .wrap,main{max-width:760px;margin:auto}h1{font-size:1.55rem;margin:0}header p{margin:4px 0;color:#cbd8e0;font-size:.82rem}main{padding:15px 14px 95px}h2{font-size:1.15rem;margin:20px 0 10px}h3{font-size:1rem;margin:12px 0 6px}.muted,small{color:#607481}.search,input,select{width:100%;padding:13px;border:1px solid #b8c8d1;border-radius:10px;background:#fff;color:#152b3b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.panel,.item{background:#fff;border:1px solid #d6e0e5;border-radius:12px}.tile{padding:16px 12px;min-height:86px;text-align:left;color:#162a38;font-weight:650}.tile small{display:block;font-size:.74rem;font-weight:400;margin-top:6px}.panel{padding:16px;margin:12px 0}.item{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px;margin:7px 0;text-align:left;color:#162a38}.item strong{display:block}.item small{display:block;margin-top:3px}.primary{background:#10283a;color:white;border:0;border-radius:10px;padding:12px 15px}.secondary{background:white;border:1px solid #a9bbc6;border-radius:10px;padding:10px 12px;color:#183449}.notice{background:#fff5e8;border-left:4px solid #b87b2d;padding:11px 13px;border-radius:5px;font-size:.86rem;margin:12px 0}.danger{background:#fff0ed;border-left:4px solid #bb453b;padding:12px;border-radius:5px}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.stack{display:grid;gap:10px}.result{background:#e9f1f5;border-radius:12px;padding:15px}.result strong{font-size:1.7rem}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 10px;background:#e6eef2;border:0;border-radius:20px;font-size:.8rem}.active{background:#10283a;color:#fff}label{font-weight:600;font-size:.86rem;display:block;margin-bottom:5px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields>div:first-child{grid-column:1/-1}.section{padding:10px 0;border-bottom:1px solid #e1e8ed}.section:last-child{border:0}.section p{margin:6px 0;line-height:1.5}.dark{background:#101a23;color:#f0f5f7}.dark main{color:#f0f5f7}.dark .panel,.dark .item,.dark .tile{background:#1b2b38;border-color:#385061;color:#f0f5f7}.dark .muted,.dark small{color:#bdcbd5}.dark .notice{background:#413321;color:#fff}.dark .danger{background:#492924}.dark .result{background:#233b4d}.dark .chip{background:#31495a;color:#fff}.dark .active{background:#e7f1f5;color:#10283a}.dark .secondary{background:#263e4e;color:#fff;border-color:#688090}.dark input,.dark select{background:#172b3a;color:#fff;border-color:#587081}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #cddae1;display:flex;justify-content:space-around;padding:8px 2px max(9px,env(safe-area-inset-bottom));z-index:3}.dark nav{background:#1b2b38;border-color:#385061}nav button{border:0;background:transparent;color:#395467;font-size:.76rem;padding:6px 4px;min-width:60px}.dark nav button{color:#d4e1e8}nav button[aria-current=page]{font-weight:800;text-decoration:underline;text-underline-offset:5px}footer{font-size:.72rem;text-align:center;color:#697e89;margin:25px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #53a7c8;outline-offset:2px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}main{padding:24px 20px 100px}}</style></head><body><header><div class="wrap"><div class="row"><div><h1>MMG <span style="font-size:.75rem;font-weight:400">v0.2</span></h1><p>Military Medic Guide · Phone-first prototype</p></div><span style="font-size:.78rem">● Offline-first</span></div></div></header><main><div id="view"></div><footer>Prototype only · Not validated for patient care · No patient data storage</footer></main><nav aria-label="Primary navigation"><button data-nav="home">⌂<br>Home</button><button data-nav="search">⌕<br>Search</button><button data-nav="quick">▤<br>Reference</button><button data-nav="calc">∑<br>Calculate</button><button data-nav="night">☾<br>0300</button></nav><script>
const departments=['Sick Call & Primary Care','Emergency Medicine','Trauma & Operational Medicine','Nursing & Patient Management','Laboratory Medicine','Radiology & Ultrasound','Pharmacy & Pharmacology','Dental Medicine','Public Health & Preventive Medicine','Bioenvironmental & Occupational Health','Medical Procedures & Skills','Medical Math & Clinical Tools','CBRNE Medicine','Environmental & Regional Medicine','Tactical Medicine & Operations','Improvised & Austere Medicine','K9 / Military Working Dog','Special Populations'];
const sheets=[{id:'chest',name:'Chest Pain',aliases:['acs','heart attack','angina'],focus:'Undifferentiated chest pain',red:'Instability, syncope, severe dyspnea, poor perfusion, concerning acute cardiac or vascular features.',history:'Onset and course; OPQRST; dyspnea, syncope, diaphoresis; cardiac, thromboembolic and vascular risks.',exam:'ABCs, vital signs, perfusion, heart and lung examination; 12-lead ECG when indicated and available.',ddx:'Acute coronary syndrome, pulmonary embolism, aortic emergency, pneumothorax, pericarditis, musculoskeletal and gastrointestinal causes.'},{id:'abd',name:'Abdominal Pain',aliases:['appendicitis','stomach pain','belly pain'],focus:'Undifferentiated abdominal pain',red:'Shock, rigid abdomen, peritoneal signs, severe progressive pain, gastrointestinal bleeding, possible pregnancy-related emergency.',history:'Location, onset, migration, vomiting, bowel and urinary symptoms, medications, relevant reproductive history.',exam:'ABCs, vital signs, hydration/perfusion, abdominal examination and indicated focused examinations.',ddx:'Appendicitis, bowel obstruction, biliary disease, urinary causes, gastroenteritis, vascular and reproductive emergencies.'},{id:'resp',name:'Cough / Respiratory Symptoms',aliases:['pneumonia','cough','shortness of breath','dyspnea'],focus:'Undifferentiated respiratory symptoms',red:'Severe work of breathing, altered mental status, cyanosis, exhaustion, instability.',history:'Duration, fever, sputum, dyspnea, chest pain, exposures, history of lung or heart disease.',exam:'ABCs, respiratory effort, respiratory rate, vital signs, auscultation and oxygenation when available.',ddx:'Pneumonia, bronchitis, asthma, COPD, heart failure, pulmonary embolism and other causes.'},{id:'dizzy',name:'Dizziness / Syncope',aliases:['vertigo','fainting','lightheaded'],focus:'Undifferentiated dizziness',red:'Focal neurological deficit, chest pain, concerning arrhythmia, persistent instability or severe new headache.',history:'Timing and triggers, loss of consciousness, neurological symptoms, medications, fluid loss.',exam:'Vital signs, perfusion, neurological assessment, gait and targeted examination as appropriate.',ddx:'Vestibular causes, orthostasis, arrhythmia, hypoglycemia, stroke and medication effects.'},{id:'skin',name:'Skin / Soft Tissue Infection',aliases:['cellulitis','abscess','red skin'],focus:'Undifferentiated skin complaint',red:'Rapid progression, severe pain out of proportion, systemic toxicity, crepitus or compromised perfusion.',history:'Onset, progression, fever, trauma, bites, exposures, immune status.',exam:'Vital signs, extent of changes, fluctuance, tenderness and distal neurovascular status.',ddx:'Cellulitis, abscess, dermatitis, DVT and necrotizing infection.'}];
const quick=[['Adult Vital Signs','Age, condition and context affect interpretation.','vital signs hr rr bp temperature spo2'],['Pediatric Vital Signs','Age-specific ranges require a verified pediatric reference.','pediatric vital signs'],['MWD / K9 Vital Signs','Canine-specific ranges and veterinary review required.','canine dog k9 vitals'],['CBC','WBC, hemoglobin, hematocrit, platelets; use local lab ranges.','cbc wbc hgb lab'],['BMP / CMP','Electrolytes, renal function and metabolic markers.','bmp cmp potassium sodium creatinine lab'],['ABG / VBG','pH, CO₂, bicarbonate and oxygenation interpretation.','abg vbg ph gas'],['Ventilator Settings','VT, RR, PEEP, FiO₂, I:E, pressures and alarm checks.','ventilator vent peep fio2'],['ECG / Cardiology','Intervals, rhythms and interpretation.','ecg ekg rhythm'],['Burns / Rule of Nines','TBSA reference and calculation workflow.','burns tbsa rule of nines'],['CBRNE / Toxidromes','Exposure recognition and protective priorities.','cbrne chemical toxic'],['MASCAL / Triage','Casualty flow, triage and documentation references.','mascal mci triage']];
let page='home', selected=null, q='', night=false, mode='0300', favorites=[];try{favorites=JSON.parse(localStorage.getItem('mmg-favorites')||'[]')}catch(e){};const root=document.getElementById('view');function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function btn(txt,fn,cls='secondary'){let b=el('button',cls,txt);b.onclick=fn;return b}function box(cls='panel'){let x=el('div',cls);return x}function addText(parent,tag,txt,cls){let x=el(tag,cls,txt);parent.append(x);return x}function navigate(p,id){page=p;selected=id||null;render();scrollTo(0,0)}function favKey(){return selected||''}function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];try{localStorage.setItem('mmg-favorites',JSON.stringify(favorites))}catch(e){}render()}
function render(){document.body.classList.toggle('dark',night||page==='night');root.replaceChildren();document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===page?'page':'false'));if(page==='home')home();if(page==='search')search();if(page==='quick')reference();if(page==='calc')calculator();if(page==='night')nightView();if(page==='sheet')sheet();if(page==='topic')topic()}
function home(){addText(root,'h2','What do you need?');let g=box('grid');[['☾ 0300 Mode','Immediate clinical priorities','night'],['⌕ Assess / Diagnose','Chief complaint T-sheets','search'],['▤ Quick Reference','Vitals, labs, ventilators','quick'],['∑ Medical Calculators','Gravity IV drip example','calc']].forEach(a=>{let b=btn(a[0],()=>navigate(a[2]),'tile');addText(b,'small',a[1]);g.append(b)});root.append(g);addText(root,'h2','Clinical & operational departments');let d=box('grid');departments.forEach((name,i)=>{let b=btn(name,()=>navigate('topic',String(i)),'tile');d.append(b)});root.append(d);addText(root,'h2','Favorites');if(!favorites.length)addText(root,'p','Star a T-sheet or reference to find it here.','muted');favorites.forEach(id=>{let s=sheets.find(x=>x.id===id);let r=quick.find(x=>x[0]===id);root.append(btn('★ '+(s?s.name:id),()=>navigate(s?'sheet':'topic',id),'item'))})}
function search(){addText(root,'h2','Search symptom, diagnosis, or finding');let input=el('input','search');input.type='search';input.placeholder='e.g., appendicitis, pneumonia, potassium';input.value=q;root.append(input);let results=box();root.append(results);function update(){q=input.value;results.replaceChildren();let term=q.toLowerCase().trim();let matches=sheets.filter(s=>!term||(s.name+' '+s.aliases.join(' ')).toLowerCase().includes(term));addText(results,'h3','T-sheets');matches.forEach(s=>{let b=btn(s.name+' →',()=>navigate('sheet',s.id),'item');results.append(b)});let refs=quick.filter(r=>term&&(r[0]+' '+r[2]).toLowerCase().includes(term));if(refs.length)addText(results,'h3','Quick references');refs.forEach(r=>results.append(btn(r[0]+' →',()=>navigate('topic',r[0]),'item')));if(!matches.length&&!refs.length)addText(results,'p','No matches in the prototype. The clinical index will expand.','muted')}input.oninput=update;update()}
function reference(){addText(root,'h2','Quick Reference');addText(root,'p','Entries below are placeholders awaiting source verification and clinical review.','muted');quick.forEach(r=>{let b=btn(r[0]+' →',()=>navigate('topic',r[0]),'item');root.append(b)})}
function topic(){let isDept=/^\d+$/.test(selected||'');let name=isDept?departments[Number(selected)]:selected;root.append(btn('← Back',()=>navigate(isDept?'home':'quick')));addText(root,'h2',name);let p=box();addText(p,'p',isDept?'Department structure reserved for sourced, reviewed clinical and operational content.':(quick.find(x=>x[0]===name)||[])[1]||'Reference entry under development.');addText(p,'div','No clinical reference values or treatment instructions are approved in this prototype.','notice');root.append(p);if(!isDept)root.append(btn(favorites.includes(name)?'★ Remove favorite':'☆ Save favorite',()=>toggleFav(name)))}
function sheet(){let s=sheets.find(x=>x.id===selected);if(!s)return navigate('search');root.append(btn('← Search',()=>navigate('search')));let r=box('row');addText(r,'h2',s.name);r.append(btn(favorites.includes(s.id)?'★':'☆',()=>toggleFav(s.id)));root.append(r);addText(root,'p','Focus: '+s.focus,'muted');let c=box('chips');[['0300','0300'],['Learn','Learn']].forEach(([t,v])=>c.append(btn(t,()=>{mode=v;render()},'chip '+(mode===v?'active':''))));root.append(c);let p=box();[['RED FLAGS',s.red,'danger'],['ASSESS — HISTORY',s.history,''],['ASSESS — EXAM',s.exam,''],['DIFFERENTIAL',s.ddx,''],['ACT / ADAPT','Use applicable approved protocols, clinical judgment and available consultation. Specific interventions are not included in this unreviewed prototype.',''],['REASSESS / EVAC','Track response, recognize deterioration, document findings and arrange consultation or evacuation when indicated.','']].forEach(([head,body,style])=>{let x=box('section '+style);addText(x,'h3',head);addText(x,'p',body);p.append(x)});root.append(p);if(mode==='Learn'){let x=box();addText(x,'h3','Why these questions matter');addText(x,'p','The full Learn Mode will explain diagnostic reasoning, test limitations, source evidence and common mistakes. This section is not yet clinically reviewed.');root.append(x)}addText(root,'div','Illustrative assessment only. Not a validated T-sheet or clinical decision support tool.','notice')}
function nightView(){night=true;addText(root,'h2','☾ 0300 Mode');addText(root,'p','Red flags → Assess → Differential → Act → Reassess.','muted');root.append(btn('⌕ Find complaint or suspected diagnosis',()=>{mode='0300';navigate('search')},'primary'));addText(root,'h3','One-tap assessments');sheets.forEach(s=>root.append(btn(s.name+' →',()=>{mode='0300';navigate('sheet',s.id)},'item')));let x=box('panel');addText(x,'h3','Before you act');addText(x,'p','Verify patient stability, scope, applicable protocols and escalation needs. No treatment guidance in this prototype has been approved.');root.append(x);root.append(btn('Exit 0300 Mode',()=>{night=false;navigate('home')}))}
function calculator(){addText(root,'h2','Gravity IV Drip Calculator');addText(root,'p','Educational calculation example — not a medication order or infusion prescription.','muted');let p=box('panel');let f=box('fields');function field(label,value){let w=box();let l=el('label',null,label);let i=el('input');i.type='number';i.min='0';i.step='any';i.value=value;w.append(l,i);f.append(w);return i}let v=field('Volume (mL)','1000'),h=field('Time (hours)','8');let w=box();addText(w,'label','Tubing drop factor (gtt/mL)');let factor=el('select');[10,15,20,60].forEach(n=>{let o=el('option',null,String(n));o.value=n;if(n===20)o.selected=true;factor.append(o)});w.append(factor);f.append(w);p.append(f);let out=box('result');p.append(out);function calc(){let volume=Number(v.value),hours=Number(h.value),df=Number(factor.value);out.replaceChildren();if(!v.value||!h.value||!Number.isFinite(volume)||!Number.isFinite(hours)||volume<=0||hours<=0){addText(out,'p','Enter positive volume and time values.');return}let rate=volume/hours, drops=volume*df/(hours*60);addText(out,'small','GRAVITY RATE');addText(out,'strong',Math.round(drops)+' gtt/min');addText(out,'p',rate.toFixed(1)+' mL/hr');addText(out,'p',`${volume} mL × ${df} gtt/mL ÷ (${hours} hr × 60 min/hr) = ${drops.toFixed(2)} gtt/min`)}[v,h,factor].forEach(i=>i.oninput=calc);calc();addText(p,'div','Verify the ordered volume, administration time, actual tubing drop factor, patient requirements and rate by independent check. Manually regulated infusions require reassessment.','notice');root.append(p);addText(root,'h3','Upcoming calculators');['Weight-based medication dosing','Burn TBSA / fluid planning','Oxygen cylinder duration','MAP / shock index','Predicted body weight for ventilation'].forEach(n=>root.append(btn(n+' · Planned',()=>navigate('topic',n),'item')))}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav!=='night')night=false;navigate(b.dataset.nav)});render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
