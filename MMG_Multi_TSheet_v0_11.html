function field(f){const [id,label,type,opts]=f;const val=get(id);if(type==='map_est')return `<div class="field"><label for="map_est">Estimated MAP (mmHg)</label><input id="map_est" readonly value="${esc(val)}" placeholder="Enter valid SBP and DBP"><div class="mini">Calculated from BP; not a measured MAP.</div></div>`;if(type==='gcs')return gcsField();if(type==='weight')return weightField();if(id==='height')return heightField();if(current==='exam'&&type==='status')return quickExam(id,label);if(type==='status')return statusField(id,label,['Normal','Abnormal','Not assessed','Unavailable']);if(type==='choice')return statusField(id,label,opts);if(type==='lab'){
 const state=labStatus(id),manual=get(id+'_state')||'Not entered',bounds=labBounds(id),hasValue=String(val).trim()!==''&&Number.isFinite(Number(val));

 <details class="lab-reference"><summary>Adjust laboratory reference range</summary><div class="grid"><div><label class="mini">Lower limit</label><input inputmode="decimal" data-input="${id}_lo" value="${esc(get(id+'_lo'))}" placeholder="Lower"></div><div><label class="mini">Upper limit</label><input inputmode="decimal" data-input="${id}_hi" value="${esc(get(id+'_hi'))}" placeholder="Upper"></div></div><div class="mini">Enter both limits from the actual laboratory report. This overrides the illustrative range. Valid limits are saved locally on this browser; encounter data are not saved. Clear both limits to restore defaults.</div></details>
 ${manual!=='Not entered'||val?`<div class="choice-note"><label class="mini" for="note_${id}">Result details / specimen / timing (optional)</label><textarea id="note_${id}" data-input="${id}_note" placeholder="Additional context…">${esc(get(id+'_note'))}</textarea></div>`:''}</div>`}
 return `<div class="field"><label for="${id}">${esc(label)}</label>${type==='text'?`<textarea id="${id}" data-input="${id}" placeholder="Enter finding, or state unknown / not assessed">${esc(val)}</textarea>`:`<input id="${id}" type="number" inputmode="decimal" data-input="${id}" value="${esc(val)}" placeholder="Not entered">`}</div>`}

'impression','disposition'].includes(current))html=section(pages.find(p=>p[0]===current)[1],fields[current].map(field).join(''));

el.oninput=()=>updateHeight(el);}else if(['weight','weight_lb'].includes(el.dataset.input)){el.oninput=()=>{const id=el.dataset.input,other=id==='weight'?'weight_lb':'weight';data[id]=el.value;const n=Number(el.value);data[other]=el.value!==''&&Number.isFinite(n)&&n>0?String(Math.round((id==='weight'?n/0.45359237:n*0.45359237)*100)/100):'';document.getElementById(other).value=data[other];};}else if(/^gcs_(eye|verbal|motor)$/.test(el.dataset.input)){el.onchange=()=>{data[el.dataset.input]=el.value;updateGcs();};}else if(el.tagName==='TEXTAREA'){el.oninput=()=>{data[el.dataset.input]=el.value};}else{el.onchange=()=>{data[el.dataset.input]=el.value;if(/_(lo|hi)$/.test(el.dataset.input))saveRange(el.dataset.input.replace(/_(lo|hi)$/,''));render()};}});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jump(b.dataset.jump));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{reportType=b.dataset.report;render()});const gen=document.getElementById('generate');if(gen)gen.onclick=()=>{review=true;render()};const copy=document.getElementById('copy');if(copy)copy.onclick=()=>{navigator.clipboard?.writeText(reportText()).then(()=>alert('Copied training-only report. Do not enter real patient information.')).catch(()=>alert('Clipboard unavailable in this browser.'))};const print=document.getElementById('print');if(print)print.onclick=()=>window.print();}

function reasoning(){let findings=[];if(get('site').split(' | ').includes('RLQ'))findings.push('RLQ location: consider appendicitis alongside urinary, bowel, and reproductive causes when applicable.');if(get('guard')==='Abnormal'||get('rebound')==='Abnormal')findings.push('Guarding or rebound recorded as abnormal: evaluate urgently for peritoneal irritation and serious intra-abdominal disease.');if(get('sbp')!==''&&Number(get('sbp'))<90)findings.push('Low recorded systolic BP: reassess perfusion and consider shock.');if(get('pregnancy')==='Possible'||get('hcg')==='Positive')findings.push('Pregnancy possible or positive: ectopic pregnancy is an important time-sensitive consideration in a compatible presentation.');if(labStatus('potassium')==='High'||labStatus('potassium')==='Critical')findings.push('Potassium flagged high: verify measurement, consider ECG and renal function, and follow applicable urgent-care protocols.');if(get('capno')==='Obstructive / shark-fin')findings.push('Obstructive capnogram selected: assess ventilation, waveform quality and clinical context.');return section('Differential diagnosis support',`<div class="notice"><strong>Disclaimer:</strong> This differential diagnosis list is for informational and educational purposes only and is not exhaustive. It does not include all possible conditions that may present with similar symptoms. This information is not a substitute for professional medical advice, diagnosis, or treatment. Clinicians must use their independent medical judgment, perform thorough patient examinations, and verify findings with authoritative sources. Reliance on this list for clinical decision-making is at the user’s own risk. This training prototype is not a validated diagnostic engine.</div><h3>Findings to consider</h3>${findings.length?findings.map(x=>`<div class="field">${esc(x)}</div>`).join(''):'<p class="muted">Enter findings in History, Exam, and Tests to see example context-based prompts.</p>'}<h3>Do not miss</h3><ul class="do-not-miss"><li>Shock or significant hemorrhage</li><li>Perforation or peritonitis</li><li>Ruptured abdominal aortic aneurysm when clinically plausible</li><li>Bowel obstruction or mesenteric ischemia</li><li>Ectopic pregnancy when applicable</li><li>Ovarian torsion when applicable</li><li>Testicular torsion when applicable</li><li>Other time-sensitive surgical or vascular causes</li></ul><h3>Information still needed</h3>${missing().slice(0,8).map(id=>`<div class="checkline"><span class="flag">${esc(labelFor(id))}</span><button class="smallbtn" data-jump="${id}">Go to</button></div>`).join('')||'<p class="good">No configured documentation gaps. This does not confirm a complete clinical assessment.</p>'}<p class="mini">The original paper form's clinical impression list inspired this layout; all clinical rules require independent current-source review before real-world use.</p>`)}
function reportText(){const sections=pages.filter(([id])=>fields[id]).map(([id,label])=>[label.toUpperCase(),fields[id]]);const header=`MMG TRAINING REPORT — NOT FOR REAL PATIENT USE\nType: ${reportType}\nPatient identifiers: NOT COLLECTED\nPrimary assessment: ${modules[primary]?.name||'Not selected'}\nAssessments: ${[...activeModules].map(k=>modules[k].name).join('; ')}\nPresenting complaints: ${[...complaints].join('; ')}\n\n`;let out=header;for(const [name,fs] of sections){out+=name+'\n';for(const [id,label,type] of fs){let v=get(id);if(id==='height')v=v?`${v} cm / ${get('height_ft')} ft ${get('height_in')} in`:'';if(get(id)==='Abnormal'&&get(id+'_findings'))v+=' — '+get(id+'_findings').split(' | ').map(o=>o+(get(findingNote(id,o))?' ('+get(findingNote(id,o))+')':'')).join('; ');if(type==='weight')v=v?`${v} kg / ${get('weight_lb')} lb`:'';if(type==='lab'){const state=labStatus(id);v=(v?`${v} (verify units); `:'')+state}out+=`${label}: ${v||'NOT DOCUMENTED'}${get(id+'_note')?' | Details: '+get(id+'_note'):''}\n`}out+='\n'}out+='DOCUMENTATION GAPS\n'+(missing().map(id=>'- '+labelFor(id)).join('\n')||'None from configured fields')+'\n\nDraft based only on entered information. Verify all entries, clinical interpretations, and local documentation requirements.';return out}
function report(){const m=missing();return section('Report readiness',`<p class="muted">Report generation never blocks an urgent handoff. This demo uses fictional training information only.</p><h3>Choose report</h3><div class="choices">${['SF 600-style draft','Teleconsult summary','MIST handoff','PCC shift handoff'].map(x=>`<button class="${reportType===x?'chosen':''}" data-report="${x}">${x}</button>`).join('')}</div><h3>${m.length} documentation warning${m.length===1?'':'s'}</h3>${m.length?m.map(id=>`<div class="checkline"><span class="flag">Missing: ${esc(labelFor(id))}</span><button class="smallbtn" data-jump="${id}">Go to</button></div>`).join(''):'<p class="good">No configured fields missing.</p>'}<div class="notice">Unknown, not assessed, pending, and unavailable should be documented explicitly. A completed field does not prove the assessment was adequate.</div><button class="btn no-print" id="generate">Generate report anyway</button>${review?`<h3>Draft preview</h3><div id="preview">${esc(reportText())}</div><div class="row no-print" style="margin-top:12px"><button class="btn secondary" id="copy">Copy draft</button><button class="btn" id="print">Print / Save PDF</button></div>`:''}`)}
document.getElementById('warningBtn').onclick=()=>go('report');document.getElementById('reportBtn').onclick=()=>go('report');render();
</script></body></html>
