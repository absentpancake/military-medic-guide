<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MMG | Abdominal Pain T-Sheet Prototype</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18283a;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#14283f;color:white;padding:18px 16px 12px;position:sticky;top:0;z-index:5}header small{color:#b7d2e7}h1{font-size:20px;margin:3px 0 9px}.wrap{max-width:860px;margin:auto}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px}.tabs button{flex:none;border:1px solid #7794aa;background:#243e58;color:white;padding:10px 12px;border-radius:9px;font-weight:600}.tabs button.active{background:white;color:#14283f}main{padding:15px 14px 110px}.panel{background:white;border:1px solid #d8e1e9;border-radius:13px;padding:16px;margin:0 0 14px;box-shadow:0 1px 3px #14283f0b}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:16px 0 8px}.muted{color:#536477;font-size:13px}.alert{background:#fff0ed;border-left:4px solid #b52b25;padding:12px;border-radius:7px;margin:10px 0}.notice{background:#eaf2fa;border-left:4px solid #23669d;padding:12px;border-radius:7px;margin:10px 0}.field{padding:11px 0;border-bottom:1px solid #e5ebef}.field:last-child{border-bottom:0}.field label{font-weight:650;display:block;margin-bottom:7px}.choices{display:flex;gap:5px;flex-wrap:wrap}.choices button{border:1px solid #b7c4cf;background:#fff;border-radius:8px;padding:8px 10px;font-size:13px}.choices button.chosen{background:#1d557e;color:white;border-color:#1d557e}.choices button.chosen.bad{background:#b12b2b;border-color:#b12b2b}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}input,textarea,select{width:100%;border:1px solid #aabac8;border-radius:8px;padding:10px;font:inherit;background:white;color:#18283a}textarea{min-height:75px}input[type=number]{font-variant-numeric:tabular-nums}.mini{font-size:12px;color:#607083;margin-top:5px}.pill{font-size:12px;border-radius:99px;background:#e9f1f7;padding:4px 8px}.flag{color:#a51e1e;font-weight:650}.good{color:#1c7052}.btn{border:0;background:#185782;color:white;padding:12px 15px;border-radius:9px;font-weight:650;cursor:pointer}.btn.secondary{background:#e5edf4;color:#18334d}.btn.danger{background:#8e2828}.btn:focus-visible,button:focus-visible{outline:3px solid #e8a434;outline-offset:2px}.footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ccd8e2;padding:10px max(14px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));z-index:4}.footer .wrap{display:flex;gap:9px}.footer button{flex:1}.hidden{display:none!important}#preview{white-space:pre-wrap;background:#f8fafc;border:1px solid #dce4ec;padding:12px;border-radius:8px;font:13px/1.5 ui-monospace,monospace;max-height:440px;overflow:auto}.checkline{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #e5ebef}.checkline button{margin-left:auto}.smallbtn{border:1px solid #c6d2dc;border-radius:7px;padding:7px;background:white;color:#19496c}.stickyhint{font-size:12px;color:#d2e1ef}svg{max-width:100%;height:auto}.bodymap{display:flex;gap:14px;align-items:center}.bodymap svg{width:110px;flex:none}.bodymap button{padding:8px 10px;border:1px solid #bac9d5;border-radius:7px;background:white}.bodymap button.chosen{background:#185782;color:white} @media print{header,.footer,.no-print{display:none!important}body{background:white}main{padding:0}.panel{box-shadow:none;border:0}#preview{max-height:none;border:0;white-space:pre-wrap} .print-only{display:block!important}}.print-only{display:none}
</style></head><body><header><div class="wrap"><small>MILITARY MEDIC GUIDE · OFFLINE TRAINING PROTOTYPE</small><h1>Abdominal / Flank Pain T-Sheet</h1><div class="tabs" id="tabs"></div><div class="stickyhint">No patient identifiers · No data sent · Training use only</div></div></header><main class="wrap"><div id="screen"></div></main><div class="footer"><div class="wrap"><button class="btn secondary" id="warningBtn">Warnings <span id="warnCount">0</span></button><button class="btn" id="reportBtn">Report preview</button></div></div><script>
'use strict';
const pages=[['initial','Initial'],['history','History'],['exam','Exam'],['diagnostics','Tests'],['reasoning','DDx'],['care','Care'],['report','Report']];
const fields={
 initial:[['chief','Chief complaint','choice',['Abdominal pain','Flank pain','Both','Other']],['onset','Onset','choice',['Sudden','Gradual','Unknown']],['sbp','Systolic BP (mmHg)','number'],['hr','Heart rate (/min)','number'],['rr','Respiratory rate (/min)','number'],['spo2','SpO₂ (%)','number'],['temp','Temperature (°C)','number'],['mental','Mental status','choice',['Alert','Altered','Unassessed']],['stability','Immediate threats / stability assessed','status']],
 history:[['duration','Duration','text'],['site','Pain location','choice',['RUQ','LUQ','RLQ','LLQ','Epigastric','Periumbilical','Suprapubic','Flank','Diffuse']],['migration','Pain migration','choice',['Yes','No','Unknown']],['severity','Pain severity (0–10)','number'],['quality','Pain quality','choice',['Sharp','Dull','Cramping','Burning','Pressure','Other']],['vomiting','Nausea / vomiting','status'],['diarrhea','Diarrhea','status'],['fever','Fever / chills','status'],['urinary','Urinary symptoms','status'],['bleeding','GI bleeding','status'],['pregnancy','Pregnancy possibility / status when relevant','choice',['Possible','Excluded by appropriate assessment','Unknown','Not applicable']],['allergies','Allergies','text'],['meds','Medications','text'],['past','Relevant medical / surgical history','text'],['context','Recent travel, trauma, food, exposures','text']],
 exam:[['appearance','General appearance','choice',['Well appearing','Distressed','Toxic appearing','Not assessed']],['tender','Abdominal tenderness','status'],['guard','Guarding','status'],['rebound','Rebound tenderness','status'],['distend','Distension','status'],['bowel','Bowel sounds','choice',['Normal','Increased','Decreased','Absent','Not assessed']],['cva','Costovertebral angle tenderness','status'],['perfusion','Peripheral perfusion','choice',['Normal','Abnormal','Not assessed']],['focused','Other focused exam findings','text']],
 diagnostics:[['cbc','CBC','lab'],['potassium','Potassium (mmol/L)','lab'],['glucose','Glucose (mg/dL)','lab'],['creatinine','Creatinine (mg/dL)','lab'],['lipase','Lipase','lab'],['ua','Urinalysis','choice',['Normal','Abnormal','Pending','Unavailable','Not indicated']],['hcg','Pregnancy test when relevant','choice',['Positive','Negative','Pending','Unavailable','Not indicated']],['ecg','ECG rhythm','choice',['Sinus rhythm','Atrial fibrillation','SVT','Wide-complex tachycardia','Ventricular fibrillation','Other / uncertain','Not obtained']],['etco2','ETCO₂ (mmHg)','number'],['capno','Capnogram pattern','choice',['Typical waveform','Obstructive / shark-fin','Rebreathing pattern','Absent / poor waveform','Other','Not obtained']],['imaging','Imaging','choice',['CT performed','Ultrasound performed','Other imaging','Pending','Unavailable','Not indicated']],['testnotes','Diagnostic interpretation / limitations','text']],
 care:[['interventions','Interventions performed','text'],['response','Response to treatment','choice',['Improved','Unchanged','Worsened','Unknown / not reassessed']],['recheck','Repeat vital signs / reassessment','text'],['consult','Consultation / medical direction','text'],['disposition','Disposition / evacuation plan','text'],['pending','Outstanding actions / pending results','text']]
};
const required=['chief','onset','sbp','hr','rr','mental','stability','site','allergies','tender','guard','interventions','response','disposition'];
const data={};let current='initial';let reportType='MIST handoff';let review=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function get(id){return data[id]??''}function set(id,val){data[id]=val;render()}function missing(){return required.filter(id=>!get(id))}
function statusField(id,label,opts){const val=get(id);return `<div class="field"><label>${esc(label)}</label><div class="choices">${opts.map(o=>`<button class="${val===o?'chosen':''} ${val===o&&o==='Abnormal'?'bad':''}" data-set="${id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`}
function field(f){const [id,label,type,opts]=f;const val=get(id);if(type==='status')return statusField(id,label,['Normal','Abnormal','Not assessed','Unavailable']);if(type==='choice')return statusField(id,label,opts);if(type==='lab'){const state=get(id+'_state')||'Not entered';return `<div class="field"><label>${esc(label)}</label><div class="grid"><input aria-label="${esc(label)} value" data-input="${id}" inputmode="decimal" value="${esc(val)}" placeholder="Exact value (optional)"><select aria-label="${esc(label)} interpretation" data-input="${id}_state">${['Not entered','Normal','High','Low','Critical','Pending','Unavailable'].map(o=>`<option ${state===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="mini">Manual status is a documented observation, not an automated diagnosis. Verify units and lab-specific ranges.</div></div>`}return `<div class="field"><label for="${id}">${esc(label)}</label>${type==='text'?`<textarea id="${id}" data-input="${id}" placeholder="Enter finding, or state unknown / not assessed">${esc(val)}</textarea>`:`<input id="${id}" type="number" inputmode="decimal" data-input="${id}" value="${esc(val)}" placeholder="Not entered">`}</div>`}
function allfields(){return Object.values(fields).flat()}function labelFor(id){return allfields().find(x=>x[0]===id)?.[1]||id}function pageFor(id){return Object.entries(fields).find(([p,fs])=>fs.some(f=>f[0]===id))?.[0]||'initial'}
function section(title,html){return `<section class="panel"><h2>${title}</h2>${html}</section>`}
function render(){document.getElementById('tabs').innerHTML=pages.map(([id,l])=>`<button class="${current===id?'active':''}" data-page="${id}">${l}</button>`).join('');document.getElementById('warnCount').textContent=missing().length;let html='';if(current==='initial')html=section('First look',`<div class="alert"><strong>Assess immediate threats first.</strong> Shock, peritonitis, severe illness, or pregnancy-related emergencies may require urgent escalation. Do not delay care to complete this form.</div>${fields.initial.map(field).join('')}`);if(current==='history')html=section('Focused history',`<p class="muted">Based on the structure of the supplied 1996–2008 abdominal / flank pain paper T-Sheet.</p>${fields.history.map(field).join('')}`);if(current==='exam')html=section('Physical examination',`<p class="muted">Only record examinations actually performed. Blank does not mean normal.</p>${fields.exam.map(field).join('')}`);if(current==='diagnostics')html=section('Tests, ECG and capnography',`<div class="notice">Select High / Low when known, or enter the measured result. The demo does not validate reference ranges or diagnose from these entries.</div>${fields.diagnostics.map(field).join('')}`);if(current==='care')html=section('Interventions, reassessment and disposition',fields.care.map(field).join(''));if(current==='reasoning')html=reasoning();if(current==='report')html=report();document.getElementById('screen').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>set(b.dataset.set,b.dataset.val));document.querySelectorAll('[data-input]').forEach(el=>el.onchange=()=>{data[el.dataset.input]=el.value;render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(pageFor(b.dataset.jump)));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{reportType=b.dataset.report;render()});const gen=document.getElementById('generate');if(gen)gen.onclick=()=>{review=true;render()};const copy=document.getElementById('copy');if(copy)copy.onclick=()=>{navigator.clipboard?.writeText(reportText()).then(()=>alert('Copied training-only report. Do not enter real patient information.')).catch(()=>alert('Clipboard unavailable in this browser.'))};const print=document.getElementById('print');if(print)print.onclick=()=>window.print();}
function go(p){current=p;render();window.scrollTo(0,0)}
function reasoning(){let findings=[];if(get('site')==='RLQ')findings.push('RLQ location: consider appendicitis alongside urinary, bowel, and reproductive causes when applicable.');if(get('guard')==='Abnormal'||get('rebound')==='Abnormal')findings.push('Guarding or rebound recorded as abnormal: evaluate urgently for peritoneal irritation and serious intra-abdominal disease.');if(get('sbp')!==''&&Number(get('sbp'))<90)findings.push('Low recorded systolic BP: reassess perfusion and consider shock.');if(get('pregnancy')==='Possible'||get('hcg')==='Positive')findings.push('Pregnancy possible or positive: ectopic pregnancy is an important time-sensitive consideration in a compatible presentation.');if(get('potassium_state')==='High'||get('potassium_state')==='Critical')findings.push('Potassium flagged high: verify measurement, consider ECG and renal function, and follow applicable urgent-care protocols.');if(get('capno')==='Obstructive / shark-fin')findings.push('Obstructive capnogram selected: assess ventilation, waveform quality and clinical context.');return section('Differential diagnosis support',`<div class="notice"><strong>Illustrative reasoning only.</strong> This is not a validated diagnostic engine. It does not rule out dangerous disease.</div><h3>Findings to consider</h3>${findings.length?findings.map(x=>`<div class="field">${esc(x)}</div>`).join(''):'<p class="muted">Enter findings in History, Exam, and Tests to see example context-based prompts.</p>'}<h3>Do not miss</h3><p>Shock, perforation/peritonitis, ruptured aneurysm when clinically plausible, bowel obstruction/ischemia, ectopic pregnancy, ovarian or testicular torsion, and other time-sensitive causes.</p><h3>Information still needed</h3>${missing().slice(0,8).map(id=>`<div class="checkline"><span class="flag">${esc(labelFor(id))}</span><button class="smallbtn" data-jump="${id}">Go to</button></div>`).join('')||'<p class="good">No configured documentation gaps. This does not confirm a complete clinical assessment.</p>'}<p class="mini">The original paper form's clinical impression list inspired this layout; all clinical rules require independent current-source review before real-world use.</p>`)}
function reportText(){const sections=[['INITIAL',fields.initial],['HISTORY',fields.history],['EXAM',fields.exam],['DIAGNOSTICS',fields.diagnostics],['CARE',fields.care]];const header=`MMG TRAINING REPORT — NOT FOR REAL PATIENT USE\nType: ${reportType}\nPatient identifiers: NOT COLLECTED\n\n`;let out=header;for(const [name,fs] of sections){out+=name+'\n';for(const [id,label,type] of fs){let v=get(id);if(type==='lab'){const state=get(id+'_state')||'Not entered';v=(v?`${v} (verify units); `:'')+state}out+=`${label}: ${v||'NOT DOCUMENTED'}\n`}out+='\n'}out+='DOCUMENTATION GAPS\n'+(missing().map(id=>'- '+labelFor(id)).join('\n')||'None from configured fields')+'\n\nDraft based only on entered information. Verify all entries, clinical interpretations, and local documentation requirements.';return out}
function report(){const m=missing();return section('Report readiness',`<p class="muted">Report generation never blocks an urgent handoff. This demo uses fictional training information only.</p><h3>Choose report</h3><div class="choices">${['SF 600-style draft','Teleconsult summary','MIST handoff','PCC shift handoff'].map(x=>`<button class="${reportType===x?'chosen':''}" data-report="${x}">${x}</button>`).join('')}</div><h3>${m.length} documentation warning${m.length===1?'':'s'}</h3>${m.length?m.map(id=>`<div class="checkline"><span class="flag">Missing: ${esc(labelFor(id))}</span><button class="smallbtn" data-jump="${id}">Go to</button></div>`).join(''):'<p class="good">No configured fields missing.</p>'}<div class="notice">Unknown, not assessed, pending, and unavailable should be documented explicitly. A completed field does not prove the assessment was adequate.</div><button class="btn no-print" id="generate">Generate report anyway</button>${review?`<h3>Draft preview</h3><div id="preview">${esc(reportText())}</div><div class="row no-print" style="margin-top:12px"><button class="btn secondary" id="copy">Copy draft</button><button class="btn" id="print">Print / Save PDF</button></div>`:''}`)}
document.getElementById('warningBtn').onclick=()=>go('report');document.getElementById('reportBtn').onclick=()=>go('report');render();
</script></body></html>
